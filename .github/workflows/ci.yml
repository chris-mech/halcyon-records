name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      - name: Restore Api (locked)
        run: dotnet restore src/HalcyonRecords.Api/HalcyonRecords.Api.csproj --locked-mode

      - name: Restore ServiceDefaults (locked)
        run: dotnet restore src/HalcyonRecords.ServiceDefaults/HalcyonRecords.ServiceDefaults.csproj --locked-mode

      - name: Restore AppHost
        run: dotnet restore src/HalcyonRecords.AppHost/HalcyonRecords.AppHost.csproj

      - name: Restore UnitTests (locked)
        run: dotnet restore tests/HalcyonRecords.Api.UnitTests/HalcyonRecords.Api.UnitTests.csproj --locked-mode

      - name: Restore SeedDataGenerator.Core (locked)
        run: dotnet restore tools/HalcyonRecords.SeedDataGenerator.Core/HalcyonRecords.SeedDataGenerator.Core.csproj --locked-mode

      - name: Build
        run: dotnet build HalcyonRecords.CI.slnf --no-restore --configuration Release

      - name: Test
        run: dotnet test HalcyonRecords.CI.slnf --no-restore --no-build --configuration Release

      - name: Restore CSharpier
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier check .

  winui:
    name: Backend (WinUI tool)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      - name: Restore SeedDataGenerator (locked)
        run: dotnet restore tools/HalcyonRecords.SeedDataGenerator/HalcyonRecords.SeedDataGenerator.csproj --locked-mode

      - name: Build
        run: dotnet build tools/HalcyonRecords.SeedDataGenerator/HalcyonRecords.SeedDataGenerator.csproj --no-restore --configuration Release

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Check formatting
        run: bun run format:check

  ci-required:
    name: CI Required
    needs: [changes, backend, winui, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Path-change detection failed"
            exit 1
          fi
          if [[ "${{ needs.backend.result }}" == "failure" || "${{ needs.backend.result }}" == "cancelled" ]]; then
            echo "Backend job failed"
            exit 1
          fi
          if [[ "${{ needs.winui.result }}" == "failure" || "${{ needs.winui.result }}" == "cancelled" ]]; then
            echo "Backend WinUI tool job failed"
            exit 1
          fi
          if [[ "${{ needs.frontend.result }}" == "failure" || "${{ needs.frontend.result }}" == "cancelled" ]]; then
            echo "Frontend job failed"
            exit 1
          fi
          echo "All required checks passed (or were correctly skipped)"