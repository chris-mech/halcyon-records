name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      - name: Restore Api (locked)
        run: dotnet restore src/HalcyonRecords.Api/HalcyonRecords.Api.csproj --locked-mode

      - name: Restore ServiceDefaults (locked)
        run: dotnet restore src/HalcyonRecords.ServiceDefaults/HalcyonRecords.ServiceDefaults.csproj --locked-mode

      - name: Restore AppHost
        run: dotnet restore src/HalcyonRecords.AppHost/HalcyonRecords.AppHost.csproj

      - name: Restore UnitTests (locked)
        run: dotnet restore tests/HalcyonRecords.Api.UnitTests/HalcyonRecords.Api.UnitTests.csproj --locked-mode

      - name: Restore SeedDataGenerator.Core (locked)
        run: dotnet restore tools/HalcyonRecords.SeedDataGenerator.Core/HalcyonRecords.SeedDataGenerator.Core.csproj --locked-mode

      - name: Build
        run: dotnet build HalcyonRecords.CI.slnf --no-restore --configuration Release

      - name: Test
        run: dotnet test HalcyonRecords.CI.slnf --no-restore --no-build --configuration Release

      - name: Restore CSharpier
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier check .

  winui:
    name: Backend (WinUI tool)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      - name: Restore SeedDataGenerator (locked)
        run: dotnet restore tools/HalcyonRecords.SeedDataGenerator/HalcyonRecords.SeedDataGenerator.csproj --locked-mode

      - name: Build
        run: dotnet build tools/HalcyonRecords.SeedDataGenerator/HalcyonRecords.SeedDataGenerator.csproj --no-restore --configuration Release

  integration:
    name: Backend (Integration tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      - name: Restore IntegrationTests (locked)
        run: dotnet restore tests/HalcyonRecords.Api.IntegrationTests/HalcyonRecords.Api.IntegrationTests.csproj --locked-mode

      - name: Build
        run: dotnet build tests/HalcyonRecords.Api.IntegrationTests/HalcyonRecords.Api.IntegrationTests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/HalcyonRecords.Api.IntegrationTests/HalcyonRecords.Api.IntegrationTests.csproj --no-restore --no-build --configuration Release

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  e2e:
    name: E2E
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Install mkcert
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
          curl -JLO "https://dl.filippo.io/mkcert/latest?for=linux/amd64"
          chmod +x mkcert-v*-linux-amd64
          sudo mv mkcert-v*-linux-amd64 /usr/local/bin/mkcert

      - name: Generate dev HTTPS certificate
        working-directory: backend
        run: |
          mkcert -install
          mkdir -p src/HalcyonRecords.Api/certs
          mkcert -pkcs12 -p12-file src/HalcyonRecords.Api/certs/kestrel.pfx localhost 127.0.0.1 ::1

      - name: Set Kestrel cert password
        working-directory: backend
        run: dotnet user-secrets set "Kestrel:Certificates:Default:Password" "changeit" --project src/HalcyonRecords.Api/HalcyonRecords.Api.csproj
      
      - name: Run E2E tests
        run: bun run test:e2e
        env:
          Parameters__mediatr_license_key: ${{ secrets.MEDIATR_LICENSE_KEY }}
          RateLimiting__PermitLimit: "1000"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  ci-required:
    name: CI Required
    needs: [changes, backend, winui, integration, frontend, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Path-change detection failed"
            exit 1
          fi
          if [[ "${{ needs.backend.result }}" == "failure" || "${{ needs.backend.result }}" == "cancelled" ]]; then
            echo "Backend job failed"
            exit 1
          fi
          if [[ "${{ needs.winui.result }}" == "failure" || "${{ needs.winui.result }}" == "cancelled" ]]; then
            echo "Backend WinUI tool job failed"
            exit 1
          fi
          if [[ "${{ needs.integration.result }}" == "failure" || "${{ needs.integration.result }}" == "cancelled" ]]; then
            echo "Backend integration tests job failed"
            exit 1
          fi
          if [[ "${{ needs.frontend.result }}" == "failure" || "${{ needs.frontend.result }}" == "cancelled" ]]; then
            echo "Frontend job failed"
            exit 1
          fi
          if [[ "${{ needs.e2e.result }}" == "failure" || "${{ needs.e2e.result }}" == "cancelled" ]]; then
            echo "E2E job failed"
            exit 1
          fi
          echo "All required checks passed (or were correctly skipped)"
