name: Publish API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/publish-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push API image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and push container image
        run: |
          dotnet publish backend/src/HalcyonRecords.Api/HalcyonRecords.Api.csproj \
            -c Release \
            --os linux \
            --arch x64 \
            -p:PublishProfile=DefaultContainer \
            -p:ContainerRegistry=ghcr.io \
            -p:ContainerRepository=${{ github.repository_owner }}/halcyon-records/api \
            -p:ContainerImageTag=sha-${GITHUB_SHA:0:7}
